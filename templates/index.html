<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Pipeline — Πτολεμαΐδα</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page">

        <header class="hero">
            <div class="hero-top">
                <p class="location">Πτολεμαΐδα</p>
                <p class="updated" id="updatedLabel">—</p>
            </div>

            <div class="hero-main">
                <div class="hero-temp">
                    <span class="temp-value" id="currentTemp">—</span>
                    <span class="temp-unit">°C</span>
                </div>
                <p class="hero-description" id="currentDescription">Φόρτωση δεδομένων…</p>
            </div>

            <div class="hero-stats">
                <div class="stat">
                    <span class="stat-value" id="currentHumidity">—</span>
                    <span class="stat-label">Υγρασία</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="currentWind">—</span>
                    <span class="stat-label">Άνεμος</span>
                </div>
            </div>
        </header>

        <hr class="divider">

        <section class="chart-section">
            <h2>Επόμενες 24 ώρες — Θερμοκρασία</h2>
            <div class="chart-container">
                <canvas id="tempChart"></canvas>
            </div>
        </section>

        <section class="chart-section">
            <h2>Επόμενες 24 ώρες — Υγρασία</h2>
            <div class="chart-container">
                <canvas id="humidityChart"></canvas>
            </div>
        </section>

        <hr class="divider">

        <footer class="pipeline-info">
            <p>
                Τα δεδομένα ενημερώνονται αυτόματα μία φορά τη μέρα μέσω ενός ETL pipeline
                (OpenWeatherMap → Python → Google BigQuery), προγραμματισμένο με GitHub Actions.
            </p>
        </footer>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
