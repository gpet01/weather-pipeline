name: Daily Weather Pipeline

on:
  schedule:
    - cron: "0 6 * * *"  # κάθε μέρα στις 6:00 UTC
  workflow_dispatch:       # επιτρέπει και χειροκίνητο trigger από το GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write GCP credentials to file
        run: echo '${{ secrets.GCP_SA_KEY }}' > gcp-key.json

      - name: Run pipeline
        env:
          API_KEY: ${{ secrets.OWM_API_KEY }}
        run: python pipeline.py